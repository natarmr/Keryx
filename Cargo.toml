[workspace]
resolver = "3"
members = [
    "crates/idboard-core",
    "crates/idboard-acl",
    "crates/idboard-store",
    "crates/idboard-ipc",
    "crates/idboardd",
    "crates/idboard",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/idboard"

[workspace.dependencies]
idboard-core = { path = "crates/idboard-core" }
idboard-acl = { path = "crates/idboard-acl" }
idboard-store = { path = "crates/idboard-store" }
idboard-ipc = { path = "crates/idboard-ipc" }

ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
interprocess = "2.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
